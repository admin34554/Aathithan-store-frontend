<div class="container-fluid p-4">

    <!-- Header -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h5 class="mb-0">

            {{ 'Inventory' | translate }}

            >

            <span class="text-primary">
                Stock Master
            </span>

        </h5>

    </div>


    <!-- Stock Form -->

    <form
        [formGroup]="stockForm"
        (ngSubmit)="saveStock()">

        <div class="card shadow-sm">

            <div class="card-header fw-semibold">

                <i class="bi bi-box-seam me-2"></i>

                Stock Information

            </div>


            <div class="card-body">

                <div class="row g-3">


                    <!-- Item Name -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Item Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            formControlName="itemName"
                            placeholder="Enter item name">

                        <div
                            class="text-danger small mt-1"
                            *ngIf="
                                stockForm.get('itemName')?.touched &&
                                stockForm.get('itemName')?.invalid
                            ">

                            Item Name is required.

                        </div>

                    </div>


                    <!-- HSN Code -->

                    <div class="col-md-6">

                        <label class="form-label">
                            HSN Code
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            formControlName="hsnCode"
                            placeholder="Enter HSN code">

                        <div
                            class="text-danger small mt-1"
                            *ngIf="
                                stockForm.get('hsnCode')?.touched &&
                                stockForm.get('hsnCode')?.invalid
                            ">

                            HSN Code is required.

                        </div>

                    </div>


                    <!-- MRP -->

                    <div class="col-md-4">

                        <label class="form-label">
                            MRP
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                ₹
                            </span>

                            <input
                                type="number"
                                class="form-control"
                                formControlName="mrp"
                                min="0"
                                step="0.01"
                                placeholder="0.00">

                        </div>

                    </div>


                    <!-- MSP -->

                    <div class="col-md-4">

                        <label class="form-label">
                            MSP
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                ₹
                            </span>

                            <input
                                type="number"
                                class="form-control"
                                formControlName="msp"
                                min="0"
                                step="0.01"
                                placeholder="0.00">

                        </div>

                    </div>


                    <!-- Quantity -->

                    <div class="col-md-4">

                        <label class="form-label">
                            Quantity
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            formControlName="quantity"
                            min="0"
                            placeholder="Enter quantity">

                    </div>


                    <!-- Active -->

                    <div class="col-md-4">

                        <div class="form-check form-switch mt-4">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                formControlName="active"
                                id="active">

                            <label
                                class="form-check-label"
                                for="active">

                                Active

                            </label>

                        </div>

                    </div>

                </div>

            </div>


            <!-- Buttons -->

            <div class="card-footer d-flex justify-content-end">

                <button
                    type="button"
                    class="btn btn-secondary me-2"
                    (click)="cancelForm()">

                    <i class="bi bi-x-circle me-1"></i>

                    Cancel

                </button>


                <button
                    type="submit"
                    class="btn btn-primary"
                    [disabled]="stockForm.invalid">

                    <i class="bi bi-check-circle me-1"></i>

                    {{ isEditMode ? 'Update' : 'Save' }}

                </button>

            </div>

        </div>

    </form>

</div>
