<div class="container-fluid p-4">

<!-- Header -->

<div class="d-flex justify-content-between align-items-center mb-4">

  <h5>{{ 'Master' | translate }} > <span class="text-primary">{{ 'BrokerMaster' | translate }}</span></h5>

  <div>

    <button class="btn btn-light me-2">
      ✏
    </button>

    <button class="btn btn-light me-2">
      🖨
    </button>

    <button class="btn btn-primary">
      + Add New
    </button>

  </div>

</div>


<form [formGroup]="brokerForm">

<div class="row g-4">

<!-- Broker Code -->

<div class="col-md-6">
<input
type="number"
class="form-control"
placeholder="{{ 'BrokerCode' | translate }}"
formControlName="code"
/>
</div>

<!-- Broker Name -->

<div class="col-md-6">
<input
type="text"
class="form-control"
placeholder="{{ 'BrokerName' | translate }}"
formControlName="brokerName"
/>
</div>

<!-- Phone Number -->

<div class="col-md-6">
<input
type="number"
class="form-control"
placeholder="{{ 'PhoneNo' | translate }}"
formControlName="phoneNo"
/>
</div>

<!-- Mobile Number -->

<div class="col-md-6">
<input
type="number"
class="form-control"
placeholder="{{ 'MobileNo' | translate }}"
formControlName="mobileNo"
/>
</div>

<!-- Local Comm -->

<div class="col-md-6">
<input
type="double"
class="form-control"
placeholder="{{ 'LocalComm' | translate }}"
formControlName="localComm"/>
</div>


<!-- Out Comm -->

<div class="col-md-6">
<input
type="double"
class="form-control"
placeholder="{{ 'OutComm' | translate }}"
formControlName="outComm"/>
</div>

<!-- Address -->

<div class="col-md-6">
<input
type="double"
class="form-control"
placeholder="{{ 'Address' | translate }}"
formControlName="address"/>
</div>


</div>




<!-- Buttons -->

<div class="text-end mt-5">

<button
type="button"
class="btn btn-secondary me-2"
(click)="cancelForm()"
>
{{ 'Cancel' | translate }}
</button>

<button
type="button"
class="btn btn-primary"
(click)="saveBroker()"
>
{{ 'Save' | translate }}
</button>

</div>

</form>

</div>
