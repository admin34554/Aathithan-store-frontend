<div class="container-fluid p-4">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5>{{ 'Master' | translate }} > <span class="text-primary">{{ 'CustomerMaster' | translate }}</span></h5>
    <button class="btn btn-primary">+ Add New</button>
  </div>

  <!-- Search -->
  <div class="row mb-4">
    <div class="col-md-4">
      <input type="text" class="form-control" placeholder="{{ 'SearchBy' | translate }} {{ 'CustomerNameCode' | translate }}">
    </div>
  </div>

  <!-- Tabs -->
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item">
      <button class="nav-link"
        [class.active]="activeTab==='details'"
        (click)="activeTab='details'">
        {{ 'CustomerDetails' | translate }}
      </button>
    </li>

    <li class="nav-item">
      <button class="nav-link"
        [class.active]="activeTab==='address'"
        (click)="activeTab='address'">
        {{ 'Address' | translate }}
      </button>
    </li>
  </ul>

<form [formGroup]="customerform" (ngSubmit)="submitForm()">

<!-- CUSTOMER DETAILS TAB -->

<div *ngIf="activeTab==='details'">

  <div class="mb-3">
    <label class="me-3">{{ 'Type' | translate }} :</label>

    <input type="radio" value="BLedger" formControlName="type"> {{ 'Ledger' | translate }}
    <input type="radio" value="OtherParty" class="ms-3" formControlName="type"> {{ 'OtherParty' | translate }}
  </div>

  <div class="row">

    <div class="col-md-6 mb-3">
      <input class="form-control" placeholder="{{ 'AadharNo' | translate }}" formControlName="aadhar">
    </div>

    <div class="col-md-6 mb-3">
      <input class="form-control" placeholder="{{ 'FullName' | translate }}" formControlName="fullName">
    </div>

    <div class="col-md-6 mb-3">
      <input class="form-control" placeholder="{{ 'Code' | translate }}" formControlName="code">
    </div>

    <div class="col-md-6 mb-3">
      <input class="form-control" placeholder="{{ 'GSTIN' | translate }}" formControlName="gstIn">
    </div>

    <div class="col-md-6 mb-3">
      <input class="form-control" placeholder="{{ 'SugarLicenseNumber' | translate }}" formControlName="sugarLicense">
    </div>

    <div class="col-md-6 mb-3">
      <input class="form-control" placeholder="{{ 'PhoneNo' | translate }}" formControlName="phone">
    </div>

    <div class="col-md-6 mb-3">
      <input class="form-control" placeholder="{{ 'MobileNo' | translate }}" formControlName="cell">
    </div>

    <div class="col-md-6 mb-3">
      <input class="form-control" placeholder="{{ 'CreditPeriod' | translate }}" formControlName="creditPeriod">
    </div>

    <div class="col-md-6 mb-3">
      <input class="form-control" placeholder="{{ 'CreditLimit' | translate }}" formControlName="creditLimit">
    </div>

  </div>

  <div class="form-check mb-3">
    <input type="checkbox" class="form-check-input" formControlName="active">
    <label class="form-check-label">{{ 'Active' | translate }}</label>
  </div>

</div>


<!-- ADDRESS TAB -->

<div *ngIf="activeTab==='address'">

  <div class="row">

    <div class="col-md-6 mb-3">
      <input class="form-control" placeholder="{{ 'DoorNo' | translate }}" formControlName="doorNo">
    </div>

    <div class="col-md-6 mb-3">
      <input class="form-control" placeholder="{{ 'Street' | translate }}" formControlName="street">
    </div>

    <div class="col-md-6 mb-3">
      <input class="form-control" placeholder="{{ 'Area' | translate }}" formControlName="area">
    </div>

    <div class="col-md-6 mb-3">
      <input class="form-control" placeholder="{{ 'City' | translate }}" formControlName="city">
    </div>

    <div class="col-md-6 mb-3">
      <input class="form-control" placeholder="{{ 'State' | translate }}" formControlName="state">
    </div>

    <div class="col-md-6 mb-3">
      <input class="form-control" placeholder="{{ 'PinCode' | translate }}" formControlName="pinCode">
    </div>

  </div>

</div>

<!-- Buttons -->

<div class="text-end mt-3">
  <button type="button" class="btn btn-secondary me-2" (click)="resetForm()">{{ 'Cancel' | translate }}</button>
  <button type="submit" class="btn btn-primary">{{ 'Save' | translate }}</button></div>

</form>

</div>
