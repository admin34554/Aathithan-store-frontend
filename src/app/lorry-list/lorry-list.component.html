<div class="container-fluid p-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5>{{ 'Master' | translate }} > <span class="text-primary">{{ 'LorryList' | translate }}</span></h5>

    <div>
        <button class="btn btb-light me-2">
            ✏
        </button>
        <button class="btn btn-light me-2">
             🖨
        </button>
        <button class="btn btn-primary" routerLink="/lorry">
            + Add New
        </button>
    </div>
</div>

<div class="row mb-3">
    <div class="col-md-4 d-flex align-items-center">
        <label class="me-2">{{ 'SearchBy' | translate }}</label>
        <input type="text" class="form-control" placeholder="{{ 'LorryNameCode' | translate }}" 
        [(ngModel)]="searchText" (input)="searchLorry()"/>    
    </div>
</div>

<div class="table-responsive">
    <table class="table table-bordered">
        <thead class="table-light">
            <tr>
                <th style="width: 100px;">{{ 'S.No' | translate }}</th>
                <th>{{ 'LorryName' | translate }}</th>
                <th>{{ 'LorryCode' | translate }}</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let lorry of paginatedLorry; let i = index">
                <td>{{ (currentPage - 1) * pageSize + i + 1 }}</td>
                <td>{{ lorry.name }}</td>
                <td>{{ lorry.code }}</td>
            </tr>
        <tr *ngIf="filteredLorry.length == 0">
            <td colspan="3" class="text-center">{{ 'NoLorryFound' | translate }}</td>
        </tr>
        </tbody>
    </table>
</div>

<div class="d-flex justify-content-end align-items-center mt-3">
    <button class="btn btn-light me-2" (click)="prevPage()">{{ 'Previous' | translate }}</button>
    <span class="me-2">Page {{ currentPage }}</span>
    <button class="btn btn-light ms-2" (click)="nextPage()">{{ 'Next' | translate }}</button>
</div>
</div>
