<div class="container-fluid p-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5>{{ 'Master' | translate }} > <span class="text-primary">{{ 'BrokerList' | translate }}</span></h5>

    <div>
        <!-- <button class="btn btb-light me-2">
            ✏
        </button>
        <button class="btn btn-light me-2">
             🖨
        </button> -->
        <button class="btn btn-primary" routerLink="/broker">
            + Add New
        </button>
    </div>
</div>

<div class="row mb-3">
    <div class="col-md-4 d-flex align-items-center">
        <label class="me-2">{{ 'SearchBy' | translate }}</label>
        <input type="text" class="form-control" placeholder="{{ 'BrokerNameCode' | translate }}" 
        [(ngModel)]="searchText" (input)="searchBroker()"/>    
    </div>
</div>

<div class="table-responsive">
    <table class="table table-bordered">
        <thead class="table-light">
            <tr>
                <th style="width: 100px;">S.No</th>
                <th>{{ 'BrokerName' | translate }}</th>
                <th>{{ 'BrokerCode' | translate }}</th>
                <th>{{ 'Actions' | translate }}</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let broker of paginatedBroker; let i = index">
                <td>{{ (currentPage - 1) * pageSize + i + 1 }}</td>
                <td>{{ broker.brokerName }}</td>
                <td>{{ broker.code }}</td>
                                  <td>

                <button class="btn btn-info btn-sm me-2" (click)="viewBroker(broker.id!)"  title="View">
  <i class="bi bi-eye"></i>
</button>

<button class="btn btn-warning btn-sm" (click)="editBroker(broker.id!)"  title="Edit">
  <i class="bi bi-pencil-square"></i>
</button>
</td>
            </tr>
        <tr *ngIf="filteredBroker.length == 0">
            <td colspan="3" class="text-center">No brokers found.</td>
        </tr>
        </tbody>
    </table>
</div>

<div class="d-flex justify-content-end align-items-center mt-3">
    <button class="btn btn-light me-2" (click)="prevPage()">{{ 'Previous' | translate }}</button>
    <span class="me-2">Page {{ currentPage }}</span>
    <button class="btn btn-light ms-2" (click)="nextPage()">{{ 'Next' | translate }}</button>
</div>
</div>
