<div class="container-fluid p-4">

<!-- Header -->

<div class="d-flex justify-content-between align-items-center mb-4">

  <h5>{{ 'Master' | translate }} > <span class="text-primary">{{ 'LorryMaster' | translate }}</span></h5>

  <!-- <div>

    <button class="btn btn-light me-2">
      ✏
    </button>

    <button class="btn btn-light me-2">
      🖨
    </button>

    <button class="btn btn-primary">
      + Add New
    </button>

  </div> -->

</div>


<form [formGroup]="lorryForm">

<div class="row g-4">

<!-- Lorry Code -->

<div class="col-md-6">
<input
type="text"
class="form-control"
placeholder="{{ 'LorryCode' | translate }}"
formControlName="code"
/>
</div>

<!-- Display Name -->

<div class="col-md-6">
<input
type="text"
class="form-control"
placeholder="{{ 'LorryName' | translate }}"
formControlName="name"
/>
</div>

<!-- Phone -->

<div class="col-md-6">
<input
type="number"
class="form-control"
placeholder="{{ 'PhoneNo' | translate }}"
formControlName="phoneNumber"
/>
</div>

<!-- Surcharge -->

<div class="col-md-6">
<input
type="number"
class="form-control"
placeholder="{{ 'Mobile' | translate }}"
formControlName="mobileNumber"
/>
</div>

<!-- Group -->

<div class="col-md-6">
<input
type="string"
class="form-control"
placeholder="{{ 'ContactPerson' | translate }}"
formControlName="contactPerson"/>
</div>

<!-- Address -->

<div class="col-md-6">
<input
type="string"
class="form-control"
placeholder="{{ 'Address' | translate }}"
formControlName="address"/>
</div>

<!-- Area Covering -->

<div class="col-md-6">
<input
type="string"
class="form-control"
placeholder="{{ 'AreaCovering' | translate }}"
formControlName="areaCovering"/>
</div>

<!-- Route Covered -->

<div class="col-md-6">

<label class="form-label">{{ 'RouteCovered' | translate }}</label>

<div class="d-flex gap-3 mt-2">



    <div class="form-check">
      <input
        class="form-check-input"
        type="checkbox"
        value="L1"
        [checked]="selectedRoutes.includes('L1')"
        [disabled]="viewMode"
        (change)="onRouteChange($event)"
      >
      <label class="form-check-label">
        {{ 'L1' | translate }}
      </label>
    </div>

    <div class="form-check">
      <input
        class="form-check-input"
        type="checkbox"
        value="L2"
        [checked]="selectedRoutes.includes('L2')"
        [disabled]="viewMode"
        (change)="onRouteChange($event)"
      >
      <label class="form-check-label">
        {{ 'L2' | translate }}
      </label>
    </div>

    <div class="form-check">
      <input
        class="form-check-input"
        type="checkbox"
        value="L3"
        [checked]="selectedRoutes.includes('L3')"
        [disabled]="viewMode"
        (change)="onRouteChange($event)"
      >
      <label class="form-check-label">
        {{ 'L3' | translate }}
      </label>
    </div>

    <div class="form-check">
      <input
        class="form-check-input"
        type="checkbox"
        value="L4"
        [checked]="selectedRoutes.includes('L4')"
        [disabled]="viewMode"
        (change)="onRouteChange($event)"
      >
      <label class="form-check-label">
        {{ 'L4' | translate }}
      </label>
    </div>

    <div class="form-check">
      <input
        class="form-check-input"
        type="checkbox"
        value="L5"
        [checked]="selectedRoutes.includes('L5')"
        [disabled]="viewMode"
        (change)="onRouteChange($event)"
      >
      <label class="form-check-label">
        {{ 'L5' | translate }}
      </label>
    </div>

  </div>
</div>
</div>
<!-- Buttons -->

<div class="text-end mt-5">

<button
  *ngIf="viewMode"
  type="button"
  class="btn btn-light"
  (click)="enableEdit()">
  ✏️
</button>

<button
  *ngIf="!viewMode"
  type="button"
  class="btn btn-primary"
  (click)="saveLorry()">
  {{ editMode ? 'Update' : 'Save' }}
</button>

<button
  type="button"
  class="btn btn-secondary"
  (click)="cancelForm()">
  Cancel
</button>

</div>

</form>

</div>
