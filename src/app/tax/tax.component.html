<div class="container-fluid p-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">
            {{ 'Master' | translate }}
            >
            <span class="text-primary">
                {{ isEditMode ? ('Edit Tax' | translate) : ('Add Tax' | translate) }}
            </span>
        </h5>
    </div>

    <div class="tax-form-container">

    <form [formGroup]="taxForm">

        <!-- HSN Details -->
        <div class="card shadow-sm mb-4">
            <div class="card-header fw-semibold">
                HSN Information
            </div>

            <div class="card-body">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">HSN Code</label>
                        <input
                            type="text"
                            class="form-control"
                            formControlName="hsnCode"
                            readonly>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">HSN Description</label>
                        <input
                            type="text"
                            class="form-control"
                            formControlName="hsnDescription">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">State Code</label>
                        <input
                            type="text"
                            class="form-control"
                            formControlName="stateCode">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">State GST Code</label>
                        <input
                            type="text"
                            class="form-control"
                            formControlName="stateGstCode">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Unit</label>
                        <input
                            type="text"
                            class="form-control"
                            formControlName="unit">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Unit Text</label>
                        <input
                            type="text"
                            class="form-control"
                            formControlName="unitText">
                    </div>

                </div>

            </div>
        </div>

        <!-- GST Rates -->
        <div class="card shadow-sm mb-4">

            <div class="card-header fw-semibold">
                GST Rates
            </div>

            <div class="card-body">

                <div class="row g-3">

                    <div class="col-md-4">
                        <label class="form-label">SGST (%)</label>
                        <input
                            type="number"
                            step="0.01"
                            class="form-control"
                            formControlName="sgst">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">CGST (%)</label>
                        <input
                            type="number"
                            step="0.01"
                            class="form-control"
                            formControlName="cgst">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">IGST (%)</label>
                        <input
                            type="number"
                            step="0.01"
                            class="form-control"
                            formControlName="igst">
                    </div>

                </div>

            </div>

        </div>

        <!-- Status -->
        <div class="card shadow-sm mb-4">

            <div class="card-header fw-semibold">
                Status
            </div>

            <div class="card-body">

                <div class="form-check form-switch">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        formControlName="active"
                        id="active">

                    <label
                        class="form-check-label"
                        for="active">
                        Active
                    </label>
                </div>

            </div>

        </div>

        <!-- Buttons -->
       <div class="d-flex justify-content-end gap-2 pb-3">
                <button
                    type="button"
                    class="btn btn-secondary"
                    (click)="cancelForm()">
                    Cancel
                </button>

                <button
                    type="button"
                    class="btn btn-primary"
                    (click)="saveTax()">
                    {{ isEditMode ? 'Update Tax' : 'Save Tax' }}
                </button>
            </div>

    </form>

</div>
</div>
